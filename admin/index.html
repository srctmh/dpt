<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAX Admin — Credit Generator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0b0f14;
    color: #e6edf3;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #12181f;
    border: 1px solid #1e2a36;
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 12px 40px rgba(0,0,0,.45);
  }
  h1 {
    font-size: 1.35rem;
    font-weight: 700;
    color: #22d3ee;
    margin-bottom: 4px;
  }
  .sub { color: #8b9cb3; font-size: .85rem; margin-bottom: 24px; }
  label {
    display: block;
    font-size: .8rem;
    color: #8b9cb3;
    margin-bottom: 6px;
    margin-top: 14px;
  }
  input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #243041;
    background: #0b0f14;
    color: #e6edf3;
    font-size: 1rem;
    outline: none;
  }
  input:focus { border-color: #22d3ee; }
  button {
    width: 100%;
    margin-top: 22px;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #06b6d4, #0891b2);
    color: #fff;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
  }
  button:hover { opacity: .92; }
  .out {
    margin-top: 20px;
    padding: 14px;
    background: #0b0f14;
    border: 1px solid #243041;
    border-radius: 10px;
    word-break: break-all;
    font-family: ui-monospace, monospace;
    font-size: .9rem;
    color: #4ade80;
    min-height: 48px;
    display: none;
  }
  .out.show { display: block; }
  .hint { margin-top: 10px; font-size: .75rem; color: #64748b; }
  .err { color: #f87171; margin-top: 10px; font-size: .85rem; display: none; }
</style>
</head>
<body>
  <div class="card">
    <h1>MAX Admin</h1>
    <p class="sub">Device ID + Credits → Generate Code</p>

    <label for="did">Device ID</label>
    <input id="did" type="text" placeholder="MAX-XXXXXXXXXXXX" autocomplete="off" spellcheck="false">

    <label for="amt">Credits</label>
    <input id="amt" type="number" min="1" max="10000" value="5" placeholder="5">

    <button id="gen">Generate Code</button>
    <p class="err" id="err"></p>
    <div class="out" id="out"></div>
    <p class="hint">Password / salt is embedded. Codes are device-bound and one-time use.</p>
  </div>

<script>
/* Same algorithm as tool (SHA-256 based key) */
const SECRET = "MAX_GUARD_2026_CORE_X7kP9mQ2";
const CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

async function sha256(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
}

function hexToCharset(hex, len) {
  let out = "", i = 0;
  while (out.length < len && i < hex.length) {
    const byte = parseInt(hex.substr(i, 2), 16);
    out += CHARS[byte % 32];
    i += 2;
  }
  return out;
}

async function generateKey(did, credits) {
  const payload = `${did}|${credits}|max_v1|${SECRET}`;
  const hash = await sha256(payload);
  const body = hexToCharset(hash, 16);
  const checksum = hexToCharset(hash.slice(-16), 4);
  return `MAX-${body.slice(0,4)}-${body.slice(4,8)}-${body.slice(8,12)}-${body.slice(12,16)}-${checksum}`;
}

document.getElementById("gen").onclick = async () => {
  const err = document.getElementById("err");
  const out = document.getElementById("out");
  err.style.display = "none";
  out.classList.remove("show");

  let did = document.getElementById("did").value.trim().toUpperCase();
  const amt = parseInt(document.getElementById("amt").value, 10);

  if (!did || !did.startsWith("MAX-")) {
    err.textContent = "Invalid Device ID (must start with MAX-)";
    err.style.display = "block";
    return;
  }
  if (!amt || amt < 1) {
    err.textContent = "Credits must be at least 1";
    err.style.display = "block";
    return;
  }

  const key = await generateKey(did, amt);
  out.textContent = key;
  out.classList.add("show");
  try {
    await navigator.clipboard.writeText(key);
  } catch (_) {}
};
</script>
</body>
</html>
